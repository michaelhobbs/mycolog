name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Pinned, not `ubuntu-latest`: @maplibre/maplibre-gl-native ships a prebuilt
    # binary for Ubuntu 24.04 only. It needs glibc >= 2.38 and links against
    # that release's sonames (libjpeg.so.8, libicu*.so.74), so a runner image
    # bump breaks it in ways an `apt` line below cannot paper over.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # @maplibre/maplibre-gl-native is a native addon that links against
      # libGLX.so.0 and libOpenGL.so.0, which the runner image does not ship —
      # hence `Error: libOpenGL.so.0: cannot open shared object file` at
      # require() time. libgl1-mesa-dri + libglx-mesa0 add the llvmpipe software
      # rasteriser, because CI has no GPU. The image/font libs below are the
      # binary's other DT_NEEDED entries; the runner has most already, and apt
      # is a no-op for those.
      - name: Install MapLibre Native runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx0 libopengl0 libgl1-mesa-dri libglx-mesa0 \
            xvfb xauth \
            libcurl4 libuv1 libx11-6 libxext6 libpng16-16 zlib1g \
            libjpeg-turbo8 libwebp7 libicu74

      - run: npm ci
      - name: Build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        # The `prebuild` thumbnail step renders with MapLibre Native through
        # GLX, which aborts with "Failed to open X display" if DISPLAY is unset.
        # That is a C++ std::runtime_error -> terminate(), so it is not a
        # catchable exception and `--soft` cannot downgrade it: the process dies.
        # Xvfb gives GLX a display to draw into. 14 thumbnails take ~3.5s.
        run: xvfb-run --auto-servernum npm run build

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          WEB_ROOT: ${{ secrets.WEB_ROOT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ \
            "${VPS_USER}@${VPS_HOST}:${WEB_ROOT}"
